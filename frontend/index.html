<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="preload" as="image" href="/LD Remodeling  images/imgi_15_4914-Bramhope-Lane-Ellicott-large-016-024-Kitchen-1500x1000-72dpi.jpg">
    <link rel="preload" as="image" href="/LD Remodeling  images/imgi_14_UCS-Woodbridge-Kitchen-by-Craig-4-of-31-scaled-1.jpg">
    <link rel="preload" as="image" href="/LD Remodeling  images/imgi_11_portf10-copyright.jpg">

  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script>
      try {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          direction: 'vertical',
          gestureDirection: 'vertical',
          smooth: true,
          mouseMultiplier: 1,
          smoothTouch: false,
          touchMultiplier: 2,
          infinite: false,
        });

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
      } catch (e) {
        console.error("Lenis init failed:", e);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
